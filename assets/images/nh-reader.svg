<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">NH Reader</title>
  <desc id="description">NH Reader app icon with a matching project title on a dark violet background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171424"/>
      <stop offset="1" stop-color="#101820"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9275ff"/>
      <stop offset="1" stop-color="#65d6df"/>
    </linearGradient>
    <clipPath id="icon">
      <rect x="218" y="315" width="450" height="450" rx="72"/>
    </clipPath>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1700" cy="150" r="540" fill="#7359d9" opacity=".12"/>
  <path d="M0 930 750 180h360L360 1080H0z" fill="#fff" opacity=".025"/>
  <rect x="198" y="295" width="490" height="490" rx="92" fill="#fff" opacity=".08"/>
  <image href="data:image/jpeg;base64," x="218" y="315" width="450" height="450" preserveAspectRatio="xMidYMid slice" clip-path="url(#icon)"/>
  <rect x="218" y="315" width="450" height="450" rx="72" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="3"/>
  <rect x="820" y="376" width="10" height="328" rx="5" fill="url(#accent)"/>
  <text x="880" y="510" fill="#f8f7ff" font-family="Arial, sans-serif" font-size="96" font-weight="700">NH Reader</text>
  <text x="885" y="586" fill="#bdb6d6" font-family="Arial, sans-serif" font-size="34" letter-spacing="8">DESKTOP READER</text>
</svg>

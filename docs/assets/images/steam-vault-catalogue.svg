<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Steam Vault Catalog</title>
  <desc id="description">Steam Vault Catalog open metadata repository and ingestion infrastructure icon on dark obsidian background.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#07111f"/>
      <stop offset="1" stop-color="#040a14"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>

    <!-- Catalog Card Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0d233a"/>
      <stop offset="1" stop-color="#091b2c"/>
    </linearGradient>

    <linearGradient id="iconGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Icon Plate Clip Path (Standard 450x450 at 218, 315 with 72px radius) -->
    <clipPath id="icon">
      <rect x="218" y="315" width="450" height="450" rx="72"/>
    </clipPath>
  </defs>

  <!-- 1. Full Canvas Background -->
  <rect width="1920" height="1080" fill="url(#background)"/>

  <!-- 2. Atmospheric Ambient Orbs -->
  <circle cx="1700" cy="150" r="540" fill="#38bdf8" opacity=".10"/>
  <circle cx="1400" cy="900" r="420" fill="#34d399" opacity=".08"/>

  <!-- 3. Signature Diagonal Light Ray -->
  <path d="M0 930 750 180h360L360 1080H0z" fill="#fff" opacity=".025"/>

  <!-- 4. Soft Outer Glow Behind Icon Plate -->
  <rect x="198" y="295" width="490" height="490" rx="92" fill="#fff" opacity=".08"/>

  <!-- 5. Icon Plate Vector Artwork Container -->
  <g clip-path="url(#icon)">
    <!-- Plate Background Base -->
    <rect x="218" y="315" width="450" height="450" fill="#091528"/>

    <!-- Internal Ambient Glows -->
    <circle cx="619" cy="343" r="160" fill="#38bdf8" opacity=".14"/>
    <circle cx="260" cy="740" r="140" fill="#34d399" opacity=".12"/>

    <!-- Vector Artwork: Catalog Ledger & Multi-Storefront Game Data Nodes -->
    <g transform="translate(268, 365)">
      <!-- Base Layer Card 3 (Lowest in stack) -->
      <rect x="50" y="230" width="250" height="48" rx="14" fill="#0c1d30" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2"/>
      <circle cx="75" cy="254" r="6" fill="#34d399" opacity="0.6"/>
      <rect x="95" y="250" width="80" height="8" rx="4" fill="#38bdf8" opacity="0.3"/>
      <rect x="190" y="250" width="80" height="8" rx="4" fill="#38bdf8" opacity="0.15"/>

      <!-- Middle Layer Card 2 -->
      <rect x="35" y="180" width="280" height="52" rx="14" fill="#0e233a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2"/>
      <circle cx="60" cy="206" r="7" fill="#38bdf8" opacity="0.7"/>
      <rect x="80" y="202" width="100" height="8" rx="4" fill="#38bdf8" opacity="0.4"/>
      <rect x="200" y="202" width="85" height="8" rx="4" fill="#34d399" opacity="0.3"/>

      <!-- Primary Catalog Vault Card 1 -->
      <rect x="20" y="40" width="310" height="145" rx="18" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2.5"/>
      
      <!-- Card Header Accent -->
      <path d="M20 58 A18 18 0 0 1 38 40 L312 40 A18 18 0 0 1 330 58 L330 68 L20 68 Z" fill="#132f4c"/>
      <circle cx="42" cy="54" r="5" fill="#f87171" opacity="0.8"/>
      <circle cx="58" cy="54" r="5" fill="#fbbf24" opacity="0.8"/>
      <circle cx="74" cy="54" r="5" fill="#34d399" opacity="0.8"/>
      <rect x="95" y="50" width="100" height="8" rx="4" fill="#38bdf8" opacity="0.4"/>

      <!-- Game Controller & Data Node Silhouette inside Primary Card -->
      <!-- D-Pad -->
      <rect x="52" y="98" width="8" height="24" rx="3" fill="#38bdf8"/>
      <rect x="44" y="106" width="24" height="8" rx="3" fill="#38bdf8"/>
      
      <!-- Action Buttons -->
      <circle cx="106" cy="102" r="4.5" fill="#34d399"/>
      <circle cx="118" cy="110" r="4.5" fill="#38bdf8"/>
      <circle cx="94" cy="110" r="4.5" fill="#38bdf8"/>
      <circle cx="106" cy="118" r="4.5" fill="#34d399"/>

      <!-- Metadata Data Lines -->
      <rect x="145" y="90" width="155" height="7" rx="3.5" fill="#f0f6fc" opacity="0.85"/>
      <rect x="145" y="105" width="125" height="6" rx="3" fill="#38bdf8" opacity="0.6"/>
      <rect x="145" y="120" width="140" height="6" rx="3" fill="#34d399" opacity="0.5"/>
      <rect x="145" y="135" width="90" height="6" rx="3" fill="#94a3b8" opacity="0.4"/>

      <!-- Connectivity Cross-Nodes -->
      <circle cx="175" cy="275" r="4" fill="#38bdf8"/>
      <circle cx="175" cy="300" r="4" fill="#34d399"/>
      <path d="M175 279 L175 296" stroke="url(#accent)" stroke-width="2" stroke-dasharray="2,2"/>
    </g>
  </g>

  <!-- 6. Outer Border Outline for Icon Plate -->
  <rect x="218" y="315" width="450" height="450" rx="72" fill="none" stroke="#38bdf8" stroke-opacity=".3" stroke-width="3"/>

  <!-- 7. Vertical Brand Accent Divider Bar -->
  <rect x="820" y="376" width="10" height="328" rx="5" fill="url(#accent)"/>

  <!-- 8. Typography Block -->
  <!-- Primary Title (H1) -->
  <text x="880" y="485" fill="#f0f6fc" font-family="Arial, sans-serif" font-size="86" font-weight="700">Steam Vault Catalogue</text>

  <!-- Subtitle / Tagline (H2) -->
  <text x="880" y="585" fill="#dfeafa" font-family="Arial, sans-serif" font-size="50" font-weight="600">Open Game Catalogue &amp; Ingestion Engine</text>

  <!-- Category Tracking Badge -->
  <text x="885" y="660" fill="#38bdf8" font-family="Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="8">COMMUNITY METADATA REPOSITORY</text>
</svg>
